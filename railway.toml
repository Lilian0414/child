[build]
builder = "RAILPACK"
buildCommand = "uv sync --project services/api --locked --no-dev"

[deploy]
startCommand = "uv run --project services/api --no-sync alembic -c services/api/alembic.ini upgrade head && exec uv run --project services/api --no-sync uvicorn child_agent_api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
